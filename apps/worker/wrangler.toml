name = "routecast-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Secretos (AEMET_API_KEY, ORS_API_KEY) con `wrangler secret put`; nunca aquí.
# En local van en .dev.vars (ignorado por git).

[vars]
ALLOWED_ORIGINS = "https://marodseg.github.io,http://localhost:5173,http://localhost:4173"

# Rate limiting best-effort por IP: 60 peticiones/min por ubicación (ARCHITECTURE §6).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "7001"

  [ratelimits.simple]
  limit = 60
  period = 60

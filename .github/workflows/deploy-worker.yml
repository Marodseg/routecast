name: Deploy worker

on:
  push:
    branches: [main]
    paths:
      - apps/worker/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @routecast/worker typecheck
      - run: pnpm exec vitest run --project worker --project providers
      # Las claves (AEMET_API_KEY, ORS_API_KEY) se suben una vez con `wrangler secret put`; nunca pasan por aquí.
      # Sin token de Cloudflare en el repositorio se omite el despliegue (se despliega a mano con `wrangler deploy`).
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/worker
        run: |
          if [ -n "$ALLOWED_ORIGINS" ]; then
            pnpm exec wrangler deploy --var "ALLOWED_ORIGINS:$ALLOWED_ORIGINS"
          else
            pnpm exec wrangler deploy
          fi
        env:
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Aviso
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Sin CLOUDFLARE_API_TOKEN en el repositorio; despliegue del Worker omitido."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

name: Deploy worker

on:
  push:
    branches: [main]
    paths:
      - apps/worker/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @routecast/worker typecheck
      - run: pnpm exec vitest run --project worker --project providers
      # Las claves (AEMET_API_KEY, ORS_API_KEY) se suben una vez con `wrangler secret put`; nunca pasan por aquí.
      - name: Deploy
        working-directory: apps/worker
        run: |
          test -n "$ALLOWED_ORIGINS" || { echo "Falta la variable ALLOWED_ORIGINS del repositorio"; exit 1; }
          pnpm exec wrangler deploy --var "ALLOWED_ORIGINS:$ALLOWED_ORIGINS"
        env:
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

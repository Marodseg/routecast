name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm --filter @routecast/web build
        env:
          # Página de proyecto (usuario.github.io/<repo>/). Para un repo usuario.github.io o dominio propio: "/".
          BASE_PATH: /${{ github.event.repository.name }}/
          # URL pública del Worker (variable del repositorio), p. ej. https://routecast-api.<cuenta>.workers.dev
          VITE_API_BASE: ${{ vars.API_BASE }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

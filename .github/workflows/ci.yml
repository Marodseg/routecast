name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm size
      - name: Install Playwright browsers
        run: pnpm --filter @routecast/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload new visual baselines (linux)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-linux
          path: apps/web/e2e/__screenshots__/linux
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
